name: Auto-Deploy to cPanel Server

# Triggers whenever code is pushed to main or master branch, or manually triggered
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Auto Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 3. Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 4. Build Production Bundle
        run: |
          npm run build

      - name: 🚀 5. Sync to cPanel Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'phrscrowd.online' }}
          username: ${{ secrets.FTP_USERNAME || 'phrscrow' }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/arm/' }}
          dangerous-clean-slate: false
